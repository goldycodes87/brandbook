<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>No signal — BrandBook</title>
<style>
  :root {
    --surface-0: #080808;
    --surface-2: #181818;
    --border: rgba(255,255,255,0.08);
    --text: #f5f5f5;
    --text-muted: #6b7280;
    --accent: #ea580c;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--surface-0);
    color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: max(env(safe-area-inset-top), 24px) 24px max(env(safe-area-inset-bottom), 24px);
    text-align: center;
  }
  main { max-width: 22rem; }
  h1 {
    font-size: 1.05rem;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    margin: 0 0 0.75rem;
  }
  p { color: var(--text-muted); font-size: 0.9rem; line-height: 1.6; margin: 0 0 1.5rem; }
  button {
    background: var(--accent);
    color: #fff;
    border: 0;
    border-radius: 10px;
    font: inherit;
    font-weight: 600;
    letter-spacing: 0.06em;
    padding: 0 1.5rem;
    min-height: 44px;
    cursor: pointer;
  }
  .mark {
    width: 44px; height: 44px;
    margin: 0 auto 1.25rem;
    border: 2px solid var(--border);
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 20px;
  }
</style>
</head>
<body>
  <main>
    <div class="mark" aria-hidden>📡</div>
    <h1>No signal</h1>
    <!-- Says which half is missing. "Your records are safe" is the sentence
         somebody standing in a corral actually needs. -->
    <p>
      BrandBook can&rsquo;t reach the ranch records from here. Nothing has been lost —
      anything you saved is on the server, and anything you were part-way through is
      still in the app.
    </p>
    <button type="button" onclick="location.reload()">TRY AGAIN</button>
  </main>
</body>
</html>
